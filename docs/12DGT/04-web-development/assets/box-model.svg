<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="460" height="320" fill="#ffffff"/>
  <!-- margin -->
  <rect x="20" y="20" width="420" height="280" fill="#f6d9c7" stroke="#d98a5b" stroke-width="1"/>
  <text x="30" y="38" font-size="13" fill="#a85a2a">margin</text>
  <!-- border -->
  <rect x="70" y="60" width="320" height="200" fill="#f4e4a6" stroke="#c9a838" stroke-width="1"/>
  <text x="80" y="78" font-size="13" fill="#8a6d18">border</text>
  <!-- padding -->
  <rect x="115" y="98" width="230" height="124" fill="#cfe6c9" stroke="#7fae74" stroke-width="1"/>
  <text x="125" y="116" font-size="13" fill="#4c7a42">padding</text>
  <!-- content -->
  <rect x="160" y="132" width="140" height="56" fill="#bcd6f0" stroke="#5b8fc9" stroke-width="1"/>
  <text x="230" y="165" font-size="13" fill="#255c94" text-anchor="middle">content</text>
  <!-- title -->
  <text x="230" y="308" font-size="12" fill="#666" text-anchor="middle">The CSS box model: every element is content wrapped in padding, border and margin.</text>
</svg>
