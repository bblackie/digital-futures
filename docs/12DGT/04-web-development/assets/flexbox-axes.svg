<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect x="0" y="0" width="480" height="300" fill="#ffffff"/>
  <!-- container -->
  <rect x="40" y="70" width="400" height="120" fill="#eef3fb" stroke="#9db8dd" stroke-width="1.5"/>
  <!-- flex items -->
  <rect x="60" y="95" width="80" height="70" fill="#bcd6f0" stroke="#5b8fc9"/>
  <rect x="180" y="95" width="80" height="70" fill="#bcd6f0" stroke="#5b8fc9"/>
  <rect x="300" y="95" width="80" height="70" fill="#bcd6f0" stroke="#5b8fc9"/>
  <text x="100" y="135" font-size="13" fill="#255c94" text-anchor="middle">1</text>
  <text x="220" y="135" font-size="13" fill="#255c94" text-anchor="middle">2</text>
  <text x="340" y="135" font-size="13" fill="#255c94" text-anchor="middle">3</text>
  <!-- main axis arrow -->
  <line x1="40" y1="215" x2="440" y2="215" stroke="#c9622b" stroke-width="2"/>
  <polygon points="440,215 430,210 430,220" fill="#c9622b"/>
  <text x="240" y="235" font-size="13" fill="#c9622b" text-anchor="middle">main axis  →  justify-content</text>
  <!-- cross axis arrow -->
  <line x1="25" y1="70" x2="25" y2="190" stroke="#4c7a42" stroke-width="2"/>
  <polygon points="25,190 20,180 30,180" fill="#4c7a42"/>
  <text x="15" y="130" font-size="13" fill="#4c7a42" text-anchor="middle" transform="rotate(-90 15 130)">cross axis  →  align-items</text>
  <text x="240" y="35" font-size="14" fill="#333" text-anchor="middle" font-weight="600">Flexbox is one-dimensional: items flow along the main axis.</text>
</svg>
